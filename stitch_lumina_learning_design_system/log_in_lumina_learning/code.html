<style>
        body {

            background-color: #F8FAFC; /* Fallback matching surface level (0dp) */
        }

            box-shadow: 0px 4px 20px rgba(15, 23, 42, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;

            background: linear-gradient(135deg, #4648d4 0%, #8455ef 100%);

<body class="bg-surface min-h-screen flex items-center justify-center p-gutter relative overflow-hidden">
<!-- Atmospheric Depth Shapes -->
<div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-primary-container/10 rounded-full blur-[120px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[400px] h-[400px] bg-secondary-container/10 rounded-full blur-[100px] pointer-events-none"></div>
<main class="w-full max-w-[400px] z-10">
<!-- Brand Identity -->
<div class="text-center mb-lg flex flex-col items-center">
<div class="mb-sm">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">
                    school
                </span>
</div>
<h1 class="font-headline-md text-headline-md font-extrabold text-primary tracking-tight">
                Lumina Learning
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs opacity-70">
                Unlock your potential today
            </p>
</div>
<!-- Login Container -->
<div class="auth-card bg-surface-container-lowest rounded-[24px] p-md">
<h2 class="font-headline-md text-headline-md text-on-surface mb-lg">Log In</h2>
<form action="#" class="space-y-md" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline text-[20px]">
                            mail
                        </span>
<input class="w-full pl-[44px] pr-md py-sm bg-surface-container-low border border-outline-variant/30 rounded-[14px] font-body-md text-body-md text-on-surface placeholder:text-outline/60 outline-none transition-all input-focus" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center px-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline text-[20px]">
                            lock
                        </span>
<input class="w-full pl-[44px] pr-md py-sm bg-surface-container-low border border-outline-variant/30 rounded-[14px] font-body-md text-body-md text-on-surface placeholder:text-outline/60 outline-none transition-all input-focus" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Stay Logged In -->
<div class="flex items-center space-x-sm px-xs">
<input class="w-base h-base text-primary border-outline-variant rounded focus:ring-primary/20" id="remember" type="checkbox"/>
<label class="font-label-md text-label-md text-on-surface-variant cursor-pointer" for="remember">Stay logged in for 30 days</label>
</div>
<!-- Primary Action -->
<button class="btn-gradient w-full py-sm rounded-[14px] font-label-md text-label-md text-on-primary shadow-md hover:shadow-lg active:scale-[0.98] transition-all duration-200" type="submit">
                    Log In
                </button>
<!-- Social Divider -->
<div class="relative py-base">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center text-caption font-caption bg-surface-container-lowest px-sm text-outline">
                        OR CONTINUE WITH
                    </div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-sm">
<button class="flex items-center justify-center space-x-sm py-sm border border-outline-variant/30 rounded-[14px] font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-all">
<img class="w-[18px] h-[18px]" data-alt="A clean, minimalist high-definition vector logo of Google on a white circular background. The colors are vibrant and crisp, reflecting a professional and modern digital identity. The lighting is flat and high-key, suitable for a sophisticated light-mode user interface element." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAQosqczwwVDkSL33CQExHj5rNo1uoU4TFCVALAKftag3biNHkJWAqeH0qh4PPd_rhCLmCuNA7gmpiZwvtkCOSJIKqYZv7XrBSEb4Rhnn2hBFH0HoEpzoB6TcHtgLOItshKdibnq0o8JdbwpJ29PsiuvUAma-GDHf6s_BPE7EfIw1YMHZ39hyU9GCS4jQIMTlRqNtDOgNPZ-TnI9LLYmkkReG5-bwbfwOiHhuuZI0y02yQRy99pPzhhG_sG_5ToZhvZA2ZgXt7Cv9Q"/>
<span>Google</span>
</button>
<button class="flex items-center justify-center space-x-sm py-sm border border-outline-variant/30 rounded-[14px] font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-all">
<img class="w-[18px] h-[18px]" data-alt="A sleek and professional minimalist Apple logo icon in deep slate grey, centered on a clean white circular background. The visual style is premium and high-tech, fitting for a modern educational platform's login interface. The lighting is subtle, with a gentle soft-focus aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCsgBDmOaPxsVxglhCH7ZuK9UgyeaMYevhWd-hhNbUXpsLfrV6toVYxA_pdwtB4Th1IImyehvvlxBhpjkYRjkPAD-qoN3h0ORxirX0s3E00KkDHm_xLvDM1YdfX_8LcnVEc7QIkHMNPXtMC4jqUcvD1y1LftuTvfjZW8ScrpA6KWyAChkumFSkpTsXncgNGTw6_4aA4XI9h83R69BphRmDhnPRSKqqozcz7H6MTWWPUBEFK_sbi3VdbGyI6LD8xdOBkzHxRcOXSi_4"/>
<span>Apple</span>
</button>

            Don't have an account?

</p>

<div class="mt-xl flex justify-center space-x-md">
<a class="font-caption text-caption text-outline/60 hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="font-caption text-caption text-outline/60 hover:text-primary transition-colors" href="#">Terms of Service</a>
</div>
</main>
<!-- Micro-interaction script -->
<script>
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.classList.add('scale-95');
            });
            button.addEventListener('mouseup', () => {
                button.classList.remove('scale-95');
            });
            button.addEventListener('mouseleave', () => {
                button.classList.remove('scale-95');
            });
        });

        // Simple visibility toggle logic
        const toggleBtn = document.querySelector('button[type="button"] span');
        const passInput = document.getElementById('password');
        if (toggleBtn && passInput) {
            toggleBtn.parentElement.addEventListener('click', () => {
                const isPass = passInput.getAttribute('type') === 'password';
                passInput.setAttribute('type', isPass ? 'text' : 'password');
                toggleBtn.textContent = isPass ? 'visibility_off' : 'visibility';
            });
        }
    </script>
