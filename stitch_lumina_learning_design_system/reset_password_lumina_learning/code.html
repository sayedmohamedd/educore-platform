<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password | Lumina Learning</title>
<!-- Google Fonts: Plus Jakarta Sans -->

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            theme: {

                        "inverse-surface": "#283044",
                        "on-tertiary-container": "#f4fffb",
                        "secondary-fixed-dim": "#d0bcff",
                        "surface-tint": "#494bd6",
                        "error-container": "#ffdad6",
                        "surface-bright": "#faf8ff",
                        "tertiary-fixed-dim": "#4fdbc8",
                        "on-tertiary-fixed": "#00201c",
                        "on-primary-fixed": "#07006c",
                        "on-secondary-fixed": "#23005c",
                        "tertiary-fixed": "#71f8e4",
                        "surface-container": "#eaedff",
                        "on-tertiary-fixed-variant": "#005048",
                        "on-surface": "#131b2e",
                        "on-secondary-fixed-variant": "#5516be",
                        "secondary-fixed": "#e9ddff",
                        "surface-dim": "#d2d9f4",

                        "on-primary-container": "#fffbff",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#c0c1ff",
                        "on-secondary": "#ffffff",
                        "primary-container": "#6063ee",
                        "tertiary": "#00685d",
                        "surface-container-low": "#f2f3ff",
                        "on-tertiary": "#ffffff",
                        "surface-container-high": "#e2e7ff",
                        "outline": "#767586",
                        "inverse-on-surface": "#eef0ff",
                        "tertiary-container": "#008376",
                        "on-primary": "#ffffff",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "on-background": "#131b2e",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#dae2fd",
                        "primary-fixed": "#e1e0ff",
                        "primary": "#4648d4",
                        "surface": "#faf8ff",
                        "on-secondary-container": "#fffbff",
                        "background": "#faf8ff",
                        "secondary-container": "#8455ef"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                        "xl": "0.75rem",

                    },
                    "spacing": {

                        "container-max": "1280px",
                        "base": "8px",

                        "xl": "64px",

                        "gutter": "24px"
                    },
                    "fontFamily": {

            }
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        
        /* Custom atmospheric gradient animation */
        @keyframes float-bg {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }
        
        .animate-float {
            animation: float-bg 15s ease-in-out infinite alternate;
        }

        .primary-gradient-btn {
            background: linear-gradient(135deg, #4648d4 0%, #6b38d4 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .primary-gradient-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0px 10px 30px rgba(70, 72, 212, 0.25);
        }
        
        .primary-gradient-btn:active {
            transform: scale(0.97);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.5);
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(70, 72, 212, 0.1);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center overflow-x-hidden p-gutter">
<!-- Atmospheric Background Decoration -->
<div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
<div class="absolute -top-1/4 -right-1/4 w-[600px] h-[600px] bg-primary/10 rounded-full blur-[100px] animate-float"></div>
<div class="absolute top-1/2 -left-1/4 w-[500px] h-[500px] bg-secondary/10 rounded-full blur-[80px] animate-float" style="animation-delay: -5s;"></div>
</div>
<!-- Auth Container -->
<main class="relative z-10 w-full max-w-[480px]">
<!-- Brand Header (Based on Shared Components Brand Logo styles) -->
<div class="text-center mb-lg">
<h1 class="text-headline-md font-headline-md font-extrabold text-primary mb-xs">Lumina Learning</h1>
<p class="text-on-surface-variant font-label-md">Student Portal</p>
</div>
<!-- Forgot Password Card -->
<div class="glass-card rounded-[20px] p-lg shadow-sm">
<div class="flex flex-col items-center mb-md text-center">
<div class="w-16 h-16 bg-primary-fixed flex items-center justify-center rounded-full mb-md">
<span class="material-symbols-outlined text-[32px] text-primary" data-icon="lock_reset">lock_reset</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">Forgot Password?</h2>
<p class="text-on-surface-variant font-body-md px-md">Enter your email to reset your password</p>
</div>
<form class="space-y-md" id="forgotPasswordForm">
<!-- Email Input -->
<div class="flex flex-col space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" data-icon="mail">mail</span>
<input class="w-full pl-12 pr-4 py-3 bg-[#F1F5F9] border-transparent border-2 focus:border-primary focus:bg-white rounded-[14px] transition-all text-body-md" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Primary Action -->
<button class="primary-gradient-btn w-full py-4 px-md text-on-primary font-label-md text-label-md rounded-[14px] shadow-sm flex items-center justify-center gap-base group" type="submit">
                    Send Reset Link
                    <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Secondary Navigation -->
<div class="mt-lg pt-md border-t border-outline-variant/30 text-center">
<a class="inline-flex items-center gap-xs font-label-md text-label-md text-primary hover:text-secondary transition-colors group" href="#">
<span class="material-symbols-outlined text-[20px]" data-icon="chevron_left">chevron_left</span>
                    Back to Login
                </a>
</div>
</div>
<!-- Footer Text (Based on Footer styles but simplified for Auth) -->
<div class="mt-lg text-center">
<p class="font-caption text-caption text-on-surface-variant opacity-60">
                © 2024 Lumina Learning. All rights reserved.
            </p>
</div>
</main>
<!-- Success Modal (Hidden by default) -->
<div class="fixed inset-0 z-50 flex items-center justify-center hidden p-gutter" id="successModal">
<div class="absolute inset-0 bg-inverse-surface/40 backdrop-blur-sm"></div>
<div class="relative bg-white rounded-[24px] p-lg max-w-[400px] w-full text-center shadow-md transform transition-all scale-95">
<div class="w-16 h-16 bg-tertiary-container/10 flex items-center justify-center rounded-full mx-auto mb-md">
<span class="material-symbols-outlined text-[32px] text-tertiary" data-icon="check_circle">check_circle</span>
</div>
<h3 class="text-headline-md font-headline-md text-on-surface mb-xs">Email Sent!</h3>
<p class="text-on-surface-variant font-body-md mb-lg">We've sent password reset instructions to your email address.</p>
<button class="w-full py-3 bg-surface-container-high hover:bg-surface-container-highest text-on-surface font-label-md rounded-[14px] transition-colors" onclick="closeModal()">
                Close
            </button>
</div>
</div>
<script>
        const form = document.getElementById('forgotPasswordForm');
        const modal = document.getElementById('successModal');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            // Simulate API call
            const submitBtn = e.target.querySelector('button');
            const originalContent = submitBtn.innerHTML;
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            `;

            setTimeout(() => {
                modal.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalContent;
            }, 1200);
        });

        function closeModal() {
            modal.classList.add('hidden');
        }
    </script>
</body></html>
