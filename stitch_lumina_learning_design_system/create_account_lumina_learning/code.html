<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .auth-gradient {
            background: linear-gradient(135deg, #4648d4 0%, #8455ef 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
        }
        .btn-hover-effect:active {
            transform: scale(0.98);
        }
    </style>

<body class="bg-background font-body-md text-on-background min-h-screen flex flex-col">
<!-- Suppressing Navigation Shell for Transactional Context (Auth Page) -->
<main class="flex-grow flex items-center justify-center relative overflow-hidden py-xl px-gutter">
<!-- Atmospheric Background Element -->
<div class="absolute top-[-10%] right-[-5%] w-[400px] h-[400px] bg-primary/10 blur-[120px] rounded-full pointer-events-none"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[400px] h-[400px] bg-secondary/10 blur-[120px] rounded-full pointer-events-none"></div>
<!-- Registration Container -->
<div class="w-full max-w-[480px] z-10">
<!-- Brand Anchor -->
<div class="text-center mb-lg">
<h1 class="font-headline-md text-headline-md font-extrabold text-primary mb-xs">Lumina Learning</h1>
<p class="font-body-md text-on-surface-variant">Empowering your educational journey</p>
</div>
<!-- Form Card -->
<div class="bg-surface-container-lowest rounded-[20px] p-md md:p-lg shadow-[0px_4px_20px_rgba(15,23,42,0.05)] border border-outline-variant/20">
<div class="mb-lg">
<h2 class="font-headline-md text-headline-md text-on-surface">Create an account</h2>
<p class="font-body-md text-on-surface-variant">Join our global community of learners.</p>
</div>
<!-- Registration Form -->
<form class="space-y-md" onsubmit="event.preventDefault();">
<!-- Full Name -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="full_name">Full Name</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline" data-icon="person">person</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-[14px] focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all duration-200 font-body-md text-on-surface" id="full_name" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Email Address -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline" data-icon="mail">mail</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-[14px] focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all duration-200 font-body-md text-on-surface" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline" data-icon="lock">lock</span>
<input class="w-full pl-12 pr-12 py-3 bg-surface-container-low border border-outline-variant rounded-[14px] focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all duration-200 font-body-md text-on-surface" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-sm py-xs">
<input class="mt-1 w-5 h-5 rounded-[4px] border-outline-variant text-primary focus:ring-primary" id="terms" type="checkbox"/>
<label class="font-caption text-caption text-on-surface-variant leading-relaxed" for="terms">
                            I agree to the <a class="text-primary font-bold hover:underline" href="#">Terms of Service</a> and <a class="text-primary font-bold hover:underline" href="#">Privacy Policy</a>.
                        </label>
</div>
<!-- Primary Action -->
<button class="w-full py-4 auth-gradient text-white font-label-md text-label-md rounded-[14px] shadow-lg shadow-primary/20 btn-hover-effect transition-transform flex items-center justify-center gap-sm mt-md">
                        Create Account
                        <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-lg flex items-center">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="px-4 font-caption text-caption text-outline uppercase tracking-widest">Or sign up with</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<!-- Social Sign Up -->
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center gap-sm py-3 px-md border-2 border-primary rounded-[14px] text-primary font-label-md text-label-md bg-transparent hover:bg-primary/5 transition-colors btn-hover-effect">
<div class="w-5 h-5 bg-contain bg-no-repeat bg-center" data-alt="A clean, minimalist vector icon of the Google 'G' logo, set against a transparent background with precise geometric construction. The style is modern, professional, and follows standard brand identity guidelines for high-end digital interfaces." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCeuJsuylhShcP6RZ-iOW9keL36_koKzsedejV_QX8yaPjwMlWlJyTCdbFEkrZvpWOwKex95-k7JM2KdtxCzGTk-YdQOK8A2WwD9Puhu8IRr86NpyzB2FeBQpiE4vrq8K5yEP593imqPF-B5or2CxdA1mO_M8AB6RU0n86Gg6thFwvi0x2gFHa4MIm679PWu2ANoK0sqwgvGDZ1jit0aXePlwpiN56H4MqcDt9ped6wdtoDx10k17L1Rtmh9Dount1DZ2tR1NIhno4')"></div>
                        Google
                    </button>
<button class="flex items-center justify-center gap-sm py-3 px-md border-2 border-primary rounded-[14px] text-primary font-label-md text-label-md bg-transparent hover:bg-primary/5 transition-colors btn-hover-effect">
<span class="material-symbols-outlined text-[20px]" data-icon="apple">apps</span>
                        Apple
                    </button>
</div>
<!-- Redirect to Login -->
<p class="mt-lg text-center font-body-md text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary font-bold hover:underline ml-xs" href="#">Log In</a>
</p>
</div>
</div>

<!-- Footer Segment -->
<footer class="bg-inverse-surface py-lg px-gutter w-full">
<div class="max-w-container-max mx-auto flex flex-col md:flex-row justify-between items-center gap-md">
<div class="font-headline-md text-headline-md text-surface-bright font-extrabold">Lumina Learning</div>
<div class="flex flex-wrap justify-center gap-lg">
<a class="font-caption text-caption text-surface-variant opacity-80 hover:opacity-100 transition-opacity" href="#">Privacy Policy</a>
<a class="font-caption text-caption text-surface-variant opacity-80 hover:opacity-100 transition-opacity" href="#">Terms of Service</a>
<a class="font-caption text-caption text-surface-variant opacity-80 hover:opacity-100 transition-opacity" href="#">Cookie Policy</a>
<a class="font-caption text-caption text-surface-variant opacity-80 hover:opacity-100 transition-opacity" href="#">Contact Us</a>
</div>
<p class="font-caption text-caption text-surface-variant opacity-80">© 2024 Lumina Learning. All rights reserved.</p>
</div>
</footer>
<!-- Form Micro-interactions -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                const icon = input.parentElement.querySelector('.material-symbols-outlined');
                if (icon) icon.classList.replace('text-outline', 'text-primary');
            });
            input.addEventListener('blur', () => {
                const icon = input.parentElement.querySelector('.material-symbols-outlined');
                if (icon) icon.classList.replace('text-primary', 'text-outline');
            });
        });

        // Toggle Password Visibility
        const passwordToggle = document.querySelector('button .material-symbols-outlined[data-icon="visibility"]');
        if (passwordToggle) {
            passwordToggle.parentElement.addEventListener('click', () => {
                const input = passwordToggle.parentElement.parentElement.querySelector('input');
                if (input.type === 'password') {
                    input.type = 'text';
                    passwordToggle.innerText = 'visibility_off';
                } else {
                    input.type = 'password';
                    passwordToggle.innerText = 'visibility';
                }
            });
        }
    </script>
</body></html>
