$kind: http-request
name: Create Category
url: "{{url}}/categories"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
body:
  type: json
  content: '{"name":"Science","description":"Programming and software development courses"}'
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res && res.data && res.data.id) {
        pm.environment.set("categoryId", res.data.id);
      }
    language: text/javascript
order: 2000000000002
