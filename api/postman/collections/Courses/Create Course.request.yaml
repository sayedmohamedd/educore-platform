$kind: http-request
name: Create Course
url: '{{url}}/courses'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
body:
  type: json
  content: |-
    {
      "title": "NestJS Backend Course",
      "description": "Learn NestJS backend development",
      "price": 500,
      "thumbnailId": "{{mediaId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res && res.data && res.data.id) {
        pm.environment.set("courseId", res.data.id);
      }
    language: text/javascript
order: 1000000000002
