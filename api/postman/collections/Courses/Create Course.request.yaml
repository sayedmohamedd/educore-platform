$kind: http-request
name: Create Course
url: "{{url}}/courses"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
body:
  type: json
  content: |-
    {
        //   "thumbnailId": "{{mediaId}}"
        "title": "OOP Basics Course",
        "description": "Learn Object Oriented Programming",
        "price": 500,
        "thumbnailId": "cmt31rwgj00014kf3o1u1ussj",
        "categories": ["cmsli2bqd0002p0f37oj81wwd"]
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res && res.data && res.data.id) {
        pm.environment.set("courseId", res.data.id);
      }
    language: text/javascript
order: 1000000000002
