$kind: http-request
name: Upload Media
url: "{{url}}/media"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
body:
  type: formdata
  content:
    - type: file
      key: file
      src:
        - /C:/Users/Dell/Desktop/frontend_routes.png
      disabled: false
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res && res.data && res.data.id) {
        pm.environment.set("mediaId", res.data.id);
      }
    language: text/javascript
order: 2000000000022
