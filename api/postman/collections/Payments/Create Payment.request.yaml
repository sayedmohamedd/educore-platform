$kind: http-request
name: Create Payment
url: '{{url}}/payments'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
body:
  type: json
  content: '{"courseId":"{{courseId}}","couponCode":"{{couponId}}"}'
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res && res.data && res.data.id) {
        pm.environment.set("paymentId", res.data.id);
      }
    language: text/javascript
order: 2000000000011
