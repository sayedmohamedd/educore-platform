$kind: http-request
name: Create Section
url: '{{url}}/courses/{{courseId}}/sections'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
body:
  type: json
  content: |-
    {
      "title": "Introduction",
      "order": 1
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res && res.data && res.data.id) {
        pm.environment.set("sectionId", res.data.id);
      }
    language: text/javascript
order: 1000000000013
