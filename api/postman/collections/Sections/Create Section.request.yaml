$kind: http-request
name: Create Section
url: "{{url}}/courses/{{courseId}}/sections"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
body:
  type: json
  content: |-
    {
      "title": "Classes",
      "order": 3
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res && res.data && res.data.id) {
        pm.environment.set("sectionId", res.data.id);
      }
    language: text/javascript
order: 1000000000013
