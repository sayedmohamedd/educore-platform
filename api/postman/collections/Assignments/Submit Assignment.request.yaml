$kind: http-request
name: Submit Assignment
url: '{{url}}/assignments/{{assignmentId}}/submit'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
body:
  type: json
  content: '{"submissionUrl":"https://github.com/user/assignment-repo"}'
order: 2000000000032
