$kind: http-request
name: Create Assignment
url: '{{url}}/assignments'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
body:
  type: json
  content: '{"title":"Build a REST API","description":"Create a simple REST API using NestJS","lessonId":"{{lessonId}}","dueDate":"2026-12-31T23:59:59.000Z"}'
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res && res.data && res.data.id) {
        pm.environment.set("assignmentId", res.data.id);
      }
    language: text/javascript
order: 2000000000029
