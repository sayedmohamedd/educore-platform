$kind: http-request
name: Create Lesson
url: "{{url}}/courses/{{courseId}}/sections/{{sectionId}}/lessons"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
body:
  type: json
  content: |-
    {
        "title": "Introduction to NestJS",
        "content": "Lesson content here",
        "description": "Lesson description here",
        "order": 1,
        "duration": 1
        //   "videoId": "{{mediaId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res && res.data && res.data.id) {
        pm.environment.set("lessonId", res.data.id);
      }
    language: text/javascript
order: 1000000000017
