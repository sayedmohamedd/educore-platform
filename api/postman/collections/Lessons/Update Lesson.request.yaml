$kind: http-request
name: Update Lesson
url: '{{url}}/lessons/{{lessonId}}'
method: PATCH
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
body:
  type: json
  content: |-
    {
      "title": "Updated Lesson Title",
      "content": "Updated content",
      "order": 2
    }
order: 1000000000019
