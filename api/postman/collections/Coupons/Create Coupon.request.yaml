$kind: http-request
name: Create Coupon
url: '{{url}}/coupons'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
body:
  type: json
  content: '{"code":"SAVE20","discount":20,"expiresAt":"2026-12-31T23:59:59.000Z"}'
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res && res.data && res.data.id) {
        pm.environment.set("couponId", res.data.id);
      }
    language: text/javascript
order: 2000000000018
